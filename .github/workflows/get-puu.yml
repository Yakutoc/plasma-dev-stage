# Default based by dev branch
name: DRAFT

on:
    workflow_dispatch:
        inputs:
            sha:
                description: ''
                required: false

jobs:
    geeet:
        name: 'DRAFT'
        runs-on: ubuntu-22.04
        env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  repository: salute-developers/plasma
                  ref: master
                  show-progress: false
                  fetch-depth: 20

            - name: Get independent versions
              run: |
                  SHA=$(git log --all --format="%H %P %s" | grep "${{ inputs.sha }}" | grep "Bump independent versions \[skip ci\]" | awk '{print $1}')
                  echo "SHA=$SHA" >> $GITHUB_ENV

            - name: Get commit message
              run: |
                COMMIT_MESSAGE=$(git show -s --format=%B "${{ github.SHA }}")
                echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
                echo "$COMMIT_MESSAGE" >> $GITHUB_ENV
                echo "EOF" >> $GITHUB_ENV

            ## Заменить харды owner repo на переменные контекста
            - name: Get pull requests id's
              id: ids
              uses: actions/github-script@v7
              with:
                  script: |
                      const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          commit_sha: `${{ inputs.sha }}`,
                          owner: 'salute-developers',
                          repo: 'plasma',
                      });

                      const data = res?.data[0].body || '';

                      const prRegex = /\[PR\]\(https:\/\/github\.com\/[^\/]+\/[^\/]+\/pull\/(\d+)\)/g;

                      const matches = Array.from(data.matchAll(prRegex));

                      const ids = matches.map(match => parseInt(match[1], 10));

                      return ids[0];

            - name: ECHO
              run: |
                  echo ${{ steps.ids.outputs.result }}
                  echo ${{ env.SHA }}
                  echo "${{ env.COMMIT_MESSAGE }}"

            ## Заменить харды owner repo на переменные контекста
            - name: add comments
              uses: actions/github-script@v7
              with:
                  script: |
                      const prNumber = parseInt(${{ steps.ids.outputs.result }}, 10);

                      const commentBody = `
                      This PR is included in version:

                            - @salutejs/plasma-giga@0.306.0
                            - @salutejs/plasma-new-hope@0.323.0
                      `;

                      await github.rest.issues.createComment({
                            owner: 'Yakutoc',
                            repo: 'plasma-dev-stage',
                            issue_number: 49,
                            body: commentBody
                      });
